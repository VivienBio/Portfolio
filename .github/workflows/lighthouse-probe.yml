name: Lighthouse probe (temporary)

on:
  push:
    branches: [claude/audit-probe]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit production pages
        run: |
          cat > report.js <<'JS'
          const [file, label] = process.argv.slice(2);
          const r = require(require('path').resolve(file));
          const c = r.categories, a = r.audits;
          const s = (k) => (c[k] ? Math.round(c[k].score * 100) : 'n/a');
          console.log(`::notice title=${label}::perf ${s('performance')} | FCP ${a['first-contentful-paint'].displayValue} LCP ${a['largest-contentful-paint'].displayValue} TBT ${a['total-blocking-time'].displayValue} CLS ${a['cumulative-layout-shift'].displayValue}`);
          const pick = (id, f) => (a[id]?.details?.items || []).slice(0, 12).map(f).join(' ; ');
          const lines = [
            'NAME-MISMATCH: ' + pick('label-content-name-mismatch', (i) => (i.node?.snippet || '').slice(0, 160)),
            'CACHE: ' + pick('uses-long-cache-ttl', (i) => `${i.url} ttl=${i.cacheLifetimeMs}`),
            'RESPONSIVE-IMG: ' + pick('uses-responsive-images', (i) => `${i.url} waste=${i.wastedBytes}`),
            'MODERN-IMG: ' + pick('modern-image-formats', (i) => `${i.url} waste=${i.wastedBytes}`),
            'UNUSED-JS: ' + pick('unused-javascript', (i) => `${i.url} waste=${i.wastedBytes} of ${i.totalBytes}`),
            'RENDER-BLOCKING: ' + pick('render-blocking-resources', (i) => `${i.url} ${i.wastedMs}ms`),
            'BOOTUP: ' + pick('bootup-time', (i) => `${i.url} ${Math.round(i.total)}ms script=${Math.round(i.scripting)}`),
            'THIRD-PARTY: ' + pick('third-party-summary', (i) => `${i.entity?.text || i.entity} ${Math.round(i.blockingTime)}ms`),
            'REFLOW: ' + pick('forced-reflow-insight', (i) => JSON.stringify(i).slice(0, 200)),
          ];
          for (const line of lines) console.log(`::warning title=${label}::${line.slice(0, 1800)}`);
          JS
          for url in https://vivien-billot.web.app/ https://vivien-billot.web.app/work/betclic; do
            for run in 1 2 3; do
              name="$(echo "$url" | sed 's#https://vivien-billot.web.app##; s#/#_#g')-mobile-$run"
              npx --yes lighthouse@12 "$url" --quiet --output=json --output-path="./$name.json" \
                --only-categories=performance,accessibility \
                --chrome-flags="--headless=new --no-sandbox" || echo "::error::lighthouse failed for $url run $run"
              if [ -f "./$name.json" ]; then
                if [ "$run" = 1 ]; then node report.js "./$name.json" "$url mobile #$run"; else node -e 'const r=require(require("path").resolve(process.argv[1]));const a=r.audits;console.log(`::notice title=${process.argv[2]}::perf ${Math.round(r.categories.performance.score*100)} | LCP ${a["largest-contentful-paint"].displayValue} TBT ${a["total-blocking-time"].displayValue}`)' "./$name.json" "$url mobile #$run"; fi
              fi
            done
          done
