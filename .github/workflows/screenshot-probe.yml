name: Font fetch probe (temporary)

on:
  push:
    branches: [claude/audit-probe]

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download Archivo (variable width and weight) from Google Fonts
        run: |
          set -euo pipefail
          mkdir -p probe-assets/fonts
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          curl -sSf -A "$UA" "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@70..115,400..800&display=swap" -o probe-assets/fonts/archivo.css
          cat probe-assets/fonts/archivo.css
          python3 - <<'PY'
          import re, urllib.request
          css = open('probe-assets/fonts/archivo.css').read()
          blocks = re.findall(r'/\*\s*([\w-]+)\s*\*/\s*@font-face\s*\{(.*?)\}', css, re.S)
          for subset, body in blocks:
              if subset not in ('latin', 'latin-ext'):
                  continue
              url = re.search(r'url\((https://[^)]+)\)', body).group(1)
              ranges = re.search(r'unicode-range:\s*([^;]+);', body).group(1)
              name = f'probe-assets/fonts/archivo-{subset}-var.woff2'
              urllib.request.urlretrieve(url, name)
              open(f'probe-assets/fonts/archivo-{subset}.unicode-range.txt', 'w').write(ranges.strip() + '\n')
              print(subset, url, ranges[:80])
          PY
          curl -sSf "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/OFL.txt" -o probe-assets/fonts/OFL-Archivo.txt
          ls -la probe-assets/fonts
      - name: Commit the fonts to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-assets
          git commit -m "Temporary: Archivo font files" || exit 0
          git push origin HEAD:claude/audit-probe
