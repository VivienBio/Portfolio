name: Screenshot probe (temporary)

on:
  push:
    branches: [claude/audit-probe]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: claude/confidentiality-and-polish
          path: site
      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the branch under review
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Serve it and capture pages
        working-directory: site
        run: |
          PORT=4300 OPENAI_API_KEY= CONTACT_FORM_ENDPOINT= GA4_MEASUREMENT_ID= node dist/Portfolio/server/server.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4300/healthz >/dev/null && break; sleep 1; done
          npx playwright install --with-deps chromium >/dev/null
          rm -rf "$GITHUB_WORKSPACE/probe-shots"
          mkdir -p "$GITHUB_WORKSPACE/probe-shots/redesign"
          cp "$GITHUB_WORKSPACE/probe/shots.mjs" ./probe-shots.mjs
          node probe-shots.mjs "$GITHUB_WORKSPACE/probe-shots/redesign"
          ls -la "$GITHUB_WORKSPACE/probe-shots/redesign"
      - name: Commit screenshots to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe-shots
          git commit -m "Temporary: redesign screenshots" || exit 0
          git push origin HEAD:claude/audit-probe
