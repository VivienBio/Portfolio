name: Temporary dependency security update

on:
  push:
    branches: [claude/security-deps]
    paths: ['.github/workflows/tmp-deps-fix.yml']

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Report available versions
        run: |
          for pkg in @angular/core @angular/router @angular/ssr @angular/build @angular/cli compression proxy-addr; do
            echo "::notice title=versions::$pkg $(npm view "$pkg" versions --json 2>&1 | tr -d '\n ' | tail -c 300)"
          done

      - name: Update the lockfile for the patched versions
        run: |
          set +e
          npm install --no-audit --no-fund > install.log 2>&1
          rc=$?
          echo "::notice title=npm-install::rc=$rc $(tail -c 3500 install.log | tr '\n' ' ')"
          [ "$rc" -eq 0 ] || exit 1
          npm update proxy-addr --no-audit --no-fund > update.log 2>&1
          rc=$?
          echo "::notice title=npm-update::rc=$rc $(tail -c 1500 update.log | tr '\n' ' ')"
          [ "$rc" -eq 0 ] || exit 1
          echo "::notice title=deps::$(npm ls @angular/core @angular/router @angular/ssr @angular/build @angular/cli compression proxy-addr 2>&1 | tr '\n' ' ')"

      - name: Verify the production audit passes
        run: |
          npm audit --omit=dev --json > audit.json || true
          jq -r '.vulnerabilities | to_entries[] | "::warning title=audit::\(.key) sev=\(.value.severity) range=\(.value.range)"' audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Commit the updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update the lockfile for patched Angular, compression and proxy-addr"
          git push
