name: Temporary dependency security update

on:
  push:
    branches: [claude/linkedin-url-case-study-og]
    paths: ['.github/workflows/tmp-deps-fix.yml']

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Update the lockfile for the patched versions
        run: |
          npm install --no-audit --no-fund
          npm update proxy-addr --no-audit --no-fund
          echo "::notice title=deps::$(npm ls @angular/core @angular/router @angular/ssr @angular/build @angular/cli compression proxy-addr 2>&1 | tr '\n' ' ')"

      - name: Verify the production audit passes
        run: |
          npm audit --omit=dev --json > audit.json || true
          jq -r '.vulnerabilities | to_entries[] | "::warning title=audit::\(.key) sev=\(.value.severity) range=\(.value.range)"' audit.json || true
          npm audit --omit=dev --audit-level=high

      - name: Commit the updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update the lockfile for patched Angular, compression and proxy-addr"
          git push
