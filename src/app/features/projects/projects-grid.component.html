<div class="projects-grid">
  @for (project of projects(); track project.title; let index = $index) {
    <article>
      <div class="project-topline">
        <span>0{{ index + 1 }}</span
        ><small>{{ project.category }}</small>
      </div>
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      <blockquote>{{ project.proof }}</blockquote>
      <ul [attr.aria-label]="copy().technologies">
        @for (technology of project.technologies; track technology) {
          <li>{{ technology }}</li>
        }
      </ul>
      <a [href]="project.url" target="_blank" rel="noopener noreferrer"
        >{{ copy().open }} <span aria-hidden="true">↗</span></a
      >
    </article>
  }
</div>
